[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . src

markers =
    unit: Unit tests for isolated components and modules
    integration: Integration tests for RAG engine and API endpoints
    profiling: Latency and profiling performance measurement tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
